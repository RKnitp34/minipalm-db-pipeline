# =============================================================================
# PALM Learning — Root Databricks Asset Bundle Configuration
# =============================================================================
# Mirrors production's databricks.yml structure exactly.
# The actual job DAG lives in resources/palm-evaluation-pipeline.yml.
#
# Deploy:  databricks bundle deploy -t dev
# Run:     databricks bundle run palm_evaluation_pipeline -t dev
# =============================================================================

bundle:
  name: palm_learning

include:
  - resources/*.yml

# ── Variables ─────────────────────────────────────────────────────────────────
variables:

  env_name:
    description: >
      Deployment environment passed as --env to every pipeline script.
      Resolves catalog/schema in fixtures/tables.yml.
      dev → minipalm.palm_learning_dev.*

  catalog_name:
    description: Unity Catalog name — REQUIRED, set per target below.

  schema_name:
    description: Schema name within the catalog.
    default: palm_learning_dev


  experiment_uuid:
    description: >
      Default experiment UUID to run the pipeline for.
    default: "exp-001-disney-midroll"

  k_values:
    description: Comma-separated K-day window sizes.
    default: "7"

# ── Targets ───────────────────────────────────────────────────────────────────
targets:

  dev:
    mode: development
    default: true
    variables:
      env_name: dev
      catalog_name: minipalm
      schema_name: palm_learning_dev
    workspace:
      host: "https://dbc-78344414-60c4.cloud.databricks.com"
