[project]
name = "palm-learning"
version = "0.1.0"
description = "PALM Learning — offline evaluation pipeline (synthetic data)"
requires-python = ">=3.10"

# Runtime deps are provided by the Databricks cluster runtime.
# Only local dev deps are listed here.
dependencies = []

[dependency-groups]
dev = [
    "pyspark>=3.4.0",
    "delta-spark>=3.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "pytest>=7.0",
    "ruff>=0.3.0",
]

[build-system]
requires      = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where   = ["."]
include = ["palm*"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length    = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
