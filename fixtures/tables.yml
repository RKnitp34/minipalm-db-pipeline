# =============================================================================
# PALM Learning — Table Registry
# =============================================================================
# Single source of truth for every table FQN.
# Mirrors production's fixtures/tables.yml exactly.
#
# Catalog : minipalm        (Unity Catalog catalog available on this workspace)
# Schema  : palm_learning_{env}  →  palm_learning_dev  in dev target
#
# Usage:
#   from palm.common.tables import build_table_vars
#   tables = build_table_vars("dev")
#   spark.table(tables["eval_experiment_population"])
# =============================================================================

pipeline:

  # ── Source tables (generated by data_generator.py) ─────────────────────────

  experiment_user_assignments:
    catalog: "minipalm"
    schema:  "palm_learning_{env}"
    table:   experiment_user_assignments

  experiment_config:
    catalog: "minipalm"
    schema:  "palm_learning_{env}"
    table:   experiment_config

  # ── Offline evaluation intermediates ───────────────────────────────────────

  # P1 output — partitioned by experiment_uuid
  eval_experiment_population:
    catalog: "minipalm"
    schema:  "palm_learning_{env}"
    table:   eval_experiment_population

  # P2 output — partitioned by [experiment_uuid, k_value]
  eval_watch_hours:
    catalog: "minipalm"
    schema:  "palm_learning_{env}"
    table:   eval_watch_hours

  # P3 output — partitioned by experiment_uuid
  eval_user_features:
    catalog: "minipalm"
    schema:  "palm_learning_{env}"
    table:   eval_user_features

  # P4 output — partitioned by [experiment_uuid, model_run_id]
  eval_cate_coefficients:
    catalog: "minipalm"
    schema:  "palm_learning_{env}"
    table:   eval_cate_coefficients

  # P5 output — partitioned by [experiment_uuid, model_run_id, t1_scenario, t0_scenario, policy_scenario]
  eval_scoring:
    catalog: "minipalm"
    schema:  "palm_learning_{env}"
    table:   eval_scoring

  # ── Final outputs ───────────────────────────────────────────────────────────

  # P6 output — partitioned by [experiment_uuid, k_value, model_run_id, t1_scenario, t0_scenario, policy_scenario]
  offline_evaluation_results:
    catalog: "minipalm"
    schema:  "palm_learning_{env}"
    table:   offline_evaluation_results

  # P7 output — partitioned by [experiment_uuid, k_value, model_run_id, t1_scenario, t0_scenario, policy_scenario]
  offline_evaluation_metrics:
    catalog: "minipalm"
    schema:  "palm_learning_{env}"
    table:   offline_evaluation_metrics
